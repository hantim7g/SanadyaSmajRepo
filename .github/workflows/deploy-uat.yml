name: Deploy UAT to VPS

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 194.35.120.80
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_DIR=/root/SanadyaBrahminSmaj-uat/SanadyaSmajRepo/SanadyaBrahminSmaj
            CONTAINER=sanadya-container-uat
            IMAGE=sanadya-app-uat
            PORT=8081

            cd $APP_DIR
            git pull origin uat

            docker build -t $IMAGE .

            docker rm -f $CONTAINER 2>/dev/null || true

            docker run -d \
              --name $CONTAINER \
              -p $PORT:8080 \
              --restart always \
              -e DB_HOST=localhost \
              -e DB_NAME=hst_samaj \
              -e DB_USER=hstuser \
              -e DB_PASS=StrongPassword123! \
