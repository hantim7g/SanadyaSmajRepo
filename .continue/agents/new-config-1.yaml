# config.yaml – cleaned version
# ---------------------------------
# • Removed duplicated API keys (kept a single placeholder).
# • Consolidated the common OpenRouter base URL under `openrouterBase`.
# • Kept only one “Autodetect” entry (the duplicate was removed).
# • Added comments for readability.

name: qwen2.5-coder 7b
version: 1.1.0
schema: v1

# -------------------------------------------------
# Common OpenRouter configuration (re‑used by many models)
# -------------------------------------------------
openrouterBase: https://openrouter.ai/api/v1
openrouterKey: <YOUR_OPENROUTER_API_KEY>   # <-- replace with your real key

models:
  - name: Autodetect
    provider: ollama
    model: AUTODETECT

  # ------------------ OpenAI / OpenRouter models ------------------
  - name: Llama 3.2 3B Instruct Free
    provider: openai
    model: meta-llama/llama-3.2-3b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Llama 3.2 1B Instruct Free
    provider: openai
    model: meta-llama/llama-3.2-1b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Llama 3.1 8B Instruct Free
    provider: openai
    model: meta-llama/llama-3.1-8b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Llama 3.1 70B Instruct Free
    provider: openai
    model: meta-llama/llama-3.1-70b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Llama 3.1 405B Instruct Free
    provider: openai
    model: meta-llama/llama-3.1-405b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: DeepSeek R1T2 Chimera Free
    provider: openai
    model: tngtech/deepseek-r1t2-chimera:free
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: kwaipilot Free
    provider: openai
    model: kwaipilot/kat-coder-pro:free
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: qwen Free
    provider: openai
    model: qwen/qwen3-4b:free
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: qwen 3 Free
    provider: openai
    model: qwen/qwen3-coder:free
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Gemini Flash 1.5 8B Free
    provider: openai
    model: google/gemini-flash-1.5-8b
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Mistral 7B Instruct Free
    provider: openai
    model: mistralai/mistral-7b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Mixtral 8x7B Instruct Free
    provider: openai
    model: mistralai/mixtral-8x7b-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Zephyr 7B Beta Free
    provider: openai
    model: huggingfaceh4/zephyr-7b-beta
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: OpenChat 7B Free
    provider: openai
    model: openchat/openchat-7b
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Nous Capybara 7B Free
    provider: openai
    model: nousresearch/nous-capybara-7b
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: MythoMax L2 13B Free
    provider: openai
    model: gryphe/mythomax-l2-13b
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Toppy M 7B Free
    provider: openai
    model: undi95/toppy-m-7b
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Qwen 2 7B Instruct Free
    provider: openai
    model: qwen2.5-coder:7b
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Phi-3 Mini 128K Instruct Free
    provider: openai
    model: microsoft/phi-3-mini-128k-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  - name: Phi-3 Medium 128K Instruct Free
    provider: openai
    model: microsoft/phi-3-medium-128k-instruct
    apiKey: <YOUR_OPENROUTER_API_KEY>
    apiBase: ${openrouterBase}

  # ------------------ Perplexity models ------------------
  - name: Perplexity Sonar Medium
    provider: openai
    model: sonar-medium-online
    apiKey: <YOUR_PERPLEXITY_API_KEY>
    apiBase: https://api.perplexity.ai

  - name: sonar
    provider: openai
    model: sonar
    apiKey: <YOUR_PERPLEXITY_API_KEY>
    apiBase: https://api.perplexity.ai
    mergeSystemAndUserMessages: true
    stripAssistantMessages: true
    stripToolMessages: true
    systemPrompt: You are a helpful assistant.

  - name: Perplexity Sonar
    provider: openai
    model: sonar
    apiKey: <YOUR_PERPLEXITY_API_KEY>
    apiBase: https://api.perplexity.ai
    mergeSystemAndUserMessages: true
    mergeAssistantMessages: true
    stripToolMessages: true
    stripAssistantMessages: true
    truncateContext: true
    contextLimit: 0
    systemPrompt: ""

  # ------------------ OpenRouter, special capabilities ------------------
  - name: "Qwen: Qwen3 Coder 480B A35B (free)"
    provider: openrouter
    model: qwen/qwen3-coder:free
    apiKey: <YOUR_OPENROUTER_API_KEY>
    defaultCompletionOptions:
      maxTokens: 262000
    capabilities:
      - tool_use

  - name: "Kwaipilot: KAT-Coder-Pro V2"
    provider: openrouter
    model: kwaipilot/kat-coder-pro-v2
    apiKey: <YOUR_OPENROUTER_API_KEY>
    defaultCompletionOptions:
      maxTokens: 80000
    capabilities:
      - tool_use

  - name: Free Models Router
    provider: openrouter
    model: openrouter/free
    apiKey: <YOUR_OPENROUTER_API_KEY>
    capabilities:
      - tool_use

# -------------------------------------------------
# Tab‑autocomplete model (re‑used for fast suggestions)
# -------------------------------------------------
tabAutocompleteModel:
  name: Fast Autocomplete Free
  provider: openai
  model: meta-llama/llama-3.2-1b-instruct
  apiKey: <YOUR_OPENROUTER_API_KEY>
  apiBase: ${openrouterBase}

# -------------------------------------------------
# Embeddings provider configuration
# -------------------------------------------------
embeddingsProvider:
  provider: openai
  model: text-embedding-3-small
  apiKey: <YOUR_OPENROUTER_API_KEY>
  apiBase: ${openrouterBase}