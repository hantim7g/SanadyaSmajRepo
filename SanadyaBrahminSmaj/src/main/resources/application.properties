spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ==================== JSP ====================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.web.resources.static-locations=classpath:/static/

# Disable Thymeleaf (if included by default)
spring.thymeleaf.enabled=false

spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

# ==================== FILE UPLOAD ====================
upload.image.dir=${UPLOAD_DIR:/var/data/uploads/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.enabled=true

server.port=${PORT:8080}


server.error.whitelabel.enabled=true
# ==================== AADHAAR ENCRYPTION (AES-256-GCM) ====================
# 256-bit (32-byte) key encoded in Base64. Generate with: openssl rand -base64 32
# IMPORTANT: Change this key before deploying to production. Never commit the real key to version control.
# Set AADHAAR_ENCRYPTION_KEY environment variable in production.
aadhaar.encryption.key=${AADHAAR_ENCRYPTION_KEY:mXzD3mLlEgA3ClLDyUhF1ty38QuzerifBXuxgDzaRG0=}

# ==================== ACTUATOR MONITORING ====================
# Expose only safe, non-sensitive endpoints publicly
management.endpoints.web.exposure.include=health,info,prometheus
# Sensitive endpoints (env, heapdump, beans, configprops, threaddump) are restricted to ADMIN via SecurityConfig
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Prometheus metrics collection
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true
management.metrics.enable.tomcat=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Application info for monitoring
info.app.name=Sanadya Brahmin Samaj Platform
info.app.description=Community management platform for Brahmin Samaj
info.app.version=0.0.1-SNAPSHOT
info.organization.name=HST

