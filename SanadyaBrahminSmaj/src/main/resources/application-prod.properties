# ==================== PROD PROFILE ====================
# Activate with: --spring.profiles.active=prod
# Do NOT commit real secrets to version control.
# All sensitive values MUST be set via environment variables.

# Database — Production
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT — Must be set via env var in production
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Aadhaar encryption — Must be set via env var
aadhaar.encryption.key=${AADHAAR_ENCRYPTION_KEY}

# PhonePe — Production credentials
phonepe.merchantId=${PHONEPE_MERCHANT_ID}
phonepe.saltKey=${PHONEPE_SALT_KEY}
phonepe.saltIndex=${PHONEPE_SALT_INDEX}
phonepe.env=${PHONEPE_ENV:PRODUCTION}
phonepe.baseUrl=${PHONEPE_BASE_URL}
phonepe.oauth.client-id=${PHONEPE_OAUTH_CLIENT_ID}
phonepe.oauth.client-secret=${PHONEPE_OAUTH_CLIENT_SECRET}
phonepe.callbackUrl=${PHONEPE_CALLBACK_URL}
phonepe.webhook.user=${PHONEPE_WEBHOOK_USER}
phonepe.webhook.pass=${PHONEPE_WEBHOOK_PASS}

# Cloudinary — Production credentials
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}

# Logging — Less verbose in production
logging.level.root=WARN
logging.level.com.hst=INFO
spring.jpa.show-sql=false

# SQL formatting off in production
spring.jpa.properties.hibernate.format_sql=false

# Server port
server.port=${PORT:8080}
