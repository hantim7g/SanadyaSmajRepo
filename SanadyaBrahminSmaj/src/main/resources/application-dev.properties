# ==================== DEV PROFILE ====================
# Activate with: --spring.profiles.active=dev
# Database — Local MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/hst_samaj_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging — verbose in dev
logging.level.com.hst=DEBUG
logging.level.org.springframework.security=DEBUG

# PhonePe — Sandbox (defaults are used)
phonepe.env=SANDBOX

# CORS — Allow localhost origins
# (Global CORS config in SecurityConfig allows all origins in dev)
